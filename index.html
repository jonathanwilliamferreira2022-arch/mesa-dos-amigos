<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa dos Amigos V3</title><style>*{box-sizing:border-box}body{margin:0;background:#102a24;color:#fff;font:16px system-ui,Arial}header{padding:18px;text-align:center;background:#081b18}h1{margin:0;font-size:25px}main{max-width:850px;margin:auto;padding:16px}.panel{background:#1a4035;border:1px solid #3b6958;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:10px;padding:12px 15px;margin:4px;background:#f6c84d;color:#17251c;font-weight:800;font-size:15px}button:disabled{opacity:.35}button.secondary{background:#b9d6cb}button.red{background:#ef857a}.cards{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:92px}.card{width:52px;height:76px;border-radius:8px;background:#fff;color:#151515;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;user-select:none;touch-action:manipulation;cursor:pointer}.card.reds{color:#c52235}.card.selected{outline:4px solid #f6c84d;transform:translateY(-7px)}.card.back{background:repeating-linear-gradient(45deg,#b72c38,#b72c38 5px,#f7cfaa 5px,#f7cfaa 8px);color:transparent}.row{display:flex;justify-content:space-around;gap:8px;align-items:center;flex-wrap:wrap}.spot{min-width:75px;text-align:center}.spot .card{margin:auto}.muted{color:#c3d7cf;font-size:13px}.center{text-align:center}.hidden{display:none}.big{font-size:23px;font-weight:bold}.hand{padding-top:15px}.notice{background:#315d4f;border-radius:10px;padding:10px;margin:10px 0}.small{font-size:13px}.card.dragging{opacity:.4}</style></head><body><header><h1>🃏 Mesa dos Amigos</h1><div class="muted">Teste V3 • Truco e Cacheta</div></header><main><section id="home" class="panel center"><h2>Escolha seu jogo</h2><button onclick="startTruco()">🃏 TRUCO PAULISTA</button><button onclick="startCacheta()">♥ CACHETA</button><p class="muted">Versão local de demonstração: você joga contra o celular. Ainda não há salas online.</p></section><section id="game" class="hidden"><button class="secondary" onclick="home()">← Menu</button><div id="content"></div></section></main><script>
const suits=['♠','♥','♦','♣'],red=s=>s==='♥'||s==='♦';let mode='',state={};const $=id=>document.getElementById(id);function showGame(){ $('home').classList.add('hidden');$('game').classList.remove('hidden') }function home(){mode='';$('home').classList.remove('hidden');$('game').classList.add('hidden')}function deck(n=1){let a=[];for(let d=0;d<n;d++)for(let s of suits)for(let v=1;v<=13;v++)a.push({v,s,id:d+'-'+s+'-'+v});return shuffle(a)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function name(v){return ({1:'A',11:'J',12:'Q',13:'K'})[v]||v}function card(c,click='',extra=''){return `<div class="card ${red(c.s)?'reds':''} ${extra}" ${click}>${name(c.v)}${c.s}</div>`}function back(){return '<div class="card back">🂠</div>'}function btn(t,fn,disabled=false){return `<button ${disabled?'disabled':''} onclick="${fn}">${t}</button>`}function info(t){return `<div class="notice center">${t}</div>`}
// Truco: demonstration of card play, variable manilha, table positions, 3-second reveal.
function startTruco(){showGame();mode='truco';state={us:0,them:0,hand:0};newTrucoHand()}function newTrucoHand(){let d=deck();state.hands=[d.splice(0,3),d.splice(0,3)];state.vira=d.pop();state.manilha=state.vira.v%13+1;state.round=0;state.roundWins=[0,0];state.table=[];state.turn=0;state.value=1;state.lock=false;state.msg='Sua vez: escolha uma carta para jogar.';renderTruco()}function strength(c){let v=c.v;if(v===state.manilha)return 100+({'♣':4,'♥':3,'♠':2,'♦':1})[c.s];return ({3:14,2:13,1:12,13:11,12:10,11:9,10:8,9:7,8:6,7:5,6:4,5:3,4:2})[v]||0}function renderTruco(){let s=state;let special=s.us===14&&s.them===14;let t=`<div class="panel center"><h2>Truco Paulista</h2><div class="big">Você ${s.us} × ${s.them} Celular</div><div class="muted">Partida até 15 • ${special?'14 × 14: mão fechada, vale 1 ponto':'Mão vale '+s.value+' ponto(s)'}</div></div><div class="panel"><div class="row"><div class="spot"><b>Celular</b><div class="cards">${s.hands[1].map(()=>back()).join('')}</div></div><div class="spot"><b>Vira</b>${card(s.vira)}<div class="small">Manilha: ${name(s.manilha)}</div></div></div><h3 class="center">Cartas na mesa</h3><div class="row"><div class="spot"><b>Celular</b>${s.table.find(x=>x.p===1)?card(s.table.find(x=>x.p===1).c):back()}</div><div class="spot"><b>Você</b>${s.table.find(x=>x.p===0)?card(s.table.find(x=>x.p===0).c):back()}</div></div><p class="center muted">Rodada ${Math.min(s.round+1,3)} de 3</p></div><div class="panel hand"><h3>Suas cartas</h3><div class="cards">${s.hands[0].map((c,i)=>card(c,`onclick="playTruco(${i})"`)).join('')}</div><div class="center">${btn('Pedir Truco / Aumentar', 'raiseTruco()',s.lock||special||s.value>=15)}${btn('Nova partida','startTruco()')}</div>${info(s.msg)}</div>`;$('content').innerHTML=t}function raiseTruco(){if(state.lock)return;state.value=state.value===1?3:Math.min(15,state.value+3);state.msg='Pedido aceito pelo celular! Esta mão vale '+state.value+' pontos.';renderTruco()}function playTruco(i){let s=state;if(s.lock||s.turn!==0||!s.hands[0][i])return;s.table.push({p:0,c:s.hands[0].splice(i,1)[0]});s.turn=1;s.msg='O celular vai jogar uma carta.';renderTruco();setTimeout(()=>{if(mode!=='truco'||s!==state)return;let ix=Math.floor(Math.random()*s.hands[1].length);s.table.push({p:1,c:s.hands[1].splice(ix,1)[0]});s.lock=true;let a=strength(s.table[0].c),b=strength(s.table[1].c);let w=a>b?0:b>a?1:-1;if(w>=0)s.roundWins[w]++;s.msg=w===-1?'Empate na rodada.':w===0?'Você venceu a rodada!':'O celular venceu a rodada!';s.msg+=' Cartas visíveis por 3 segundos.';renderTruco();setTimeout(()=>{if(mode!=='truco'||s!==state)return;s.table=[];s.round++;s.lock=false;s.turn=0;if(s.roundWins[0]>=2||s.roundWins[1]>=2||s.round===3){let winner=s.roundWins[0]>=s.roundWins[1]?0:1;let points=(s.us===14&&s.them===14)?1:s.value;if(winner===0)s.us=Math.min(15,s.us+points);else s.them=Math.min(15,s.them+points);if(s.us>=15||s.them>=15){s.msg=(s.us>=15?'Você':'O celular')+' venceu a partida!';s.lock=true;renderTruco();return}newTrucoHand();state.msg=(winner===0?'Você':'O celular')+' ganhou a mão! Nova mão distribuída.';renderTruco()}else{s.msg='Próxima rodada: escolha uma carta.';renderTruco()}},3000)},650)}
// Cacheta: local prototype with drag-and-drop and touch tap-to-reorder.
function startCacheta(){showGame();mode='cacheta';let d=deck(2),hands=[d.splice(0,9),d.splice(0,9)];state={d,hands,discard:[d.pop()],vira:d.pop(),points:[10,10],turn:0,drawn:false,picked:null,selected:null,msg:'Compre do monte ou pegue a última carta do descarte.',ended:false};renderCacheta()}function jokerV(){return state.vira.v%13+1}function renderCacheta(){let s=state,top=s.discard.at(-1);$('content').innerHTML=`<div class="panel center"><h2>Cacheta</h2><div class="big">Você ${s.points[0]} pontos • Celular ${s.points[1]} pontos</div><div class="muted">2 baralhos sem jokers • 9 cartas • curinga: ${name(jokerV())} de qualquer naipe</div></div><div class="panel"><div class="center"><b>Cartas do celular</b><div class="cards">${s.hands[1].map(()=>back()).join('')}</div></div><div class="row" style="margin:22px 0"><div class="spot"><b>Monte</b>${back()}<div class="small">${s.d.length} cartas</div></div><div class="spot"><b>Último descarte</b>${top?card(top):'—'}<div class="small">Somente a carta de cima pode ser pega</div></div><div class="spot"><b>Carta virada</b>${card(s.vira)}</div></div><div class="center">${btn('Comprar do monte','buyCacheta()',s.drawn||s.ended)}${btn('Pegar descarte','takeCacheta()',s.drawn||!top||s.ended)}</div></div><div class="panel"><h3>Suas cartas <span class="muted">(toque em duas cartas para trocar de posição ou arraste)</span></h3><div class="cards" id="cachehand">${s.hands[0].map((c,i)=>`<div draggable="true" ondragstart="dragStart(event,${i})" ondragover="event.preventDefault()" ondrop="dropCard(event,${i})" ontouchstart="touchStart(event,${i})" ontouchend="touchEnd(event,${i})" class="card ${red(c.s)?'reds':''} ${s.selected===i?'selected':''}" onclick="selectCacheta(${i})">${name(c.v)}${c.s}</div>`).join('')}</div><div class="center">${btn('Descartar carta selecionada','discardCacheta()',!s.drawn||s.selected===null||s.ended)}${btn('BATER! (verificar jogos)','beatCacheta()',s.ended)}${btn('Nova partida','startCacheta()')}</div>${info(s.msg)}</div><p class="muted center">Demonstração local: a validação completa das combinações, a batida fora da vez e as salas com amigos ainda estão em desenvolvimento.</p>`}function selectCacheta(i){let s=state;if(s.selected===null)s.selected=i;else if(s.selected===i)s.selected=null;else{[s.hands[0][i],s.hands[0][s.selected]]=[s.hands[0][s.selected],s.hands[0][i]];s.selected=null}s.msg='Organize suas cartas para montar trincas e sequências.';renderCacheta()}let dragging=null,touching=null;function dragStart(e,i){dragging=i}function dropCard(e,i){e.preventDefault();if(dragging===null)return;let h=state.hands[0];let c=h.splice(dragging,1)[0];h.splice(i,0,c);dragging=null;state.selected=null;renderCacheta()}function touchStart(e,i){touching={i,x:e.touches[0].clientX,y:e.touches[0].clientY}}function touchEnd(e,i){if(!touching)return;let t=e.changedTouches[0],target=document.elementFromPoint(t.clientX,t.clientY)?.closest('#cachehand .card');if(target&&Math.abs(t.clientX-touching.x)+Math.abs(t.clientY-touching.y)>25){let dest=[...target.parentElement.children].indexOf(target),h=state.hands[0],c=h.splice(touching.i,1)[0];h.splice(dest,0,c);state.selected=null;renderCacheta()}touching=null}function buyCacheta(){let s=state;if(s.drawn||s.ended)return;if(!s.d.length){s.msg='Monte esgotado nesta demonstração. Inicie outra partida.';renderCacheta();return}s.hands[0].push(s.d.pop());s.drawn=true;s.msg='Carta comprada! Escolha uma carta para descartar ou tente bater.';renderCacheta()}function takeCacheta(){let s=state;if(s.drawn||s.ended||!s.discard.length)return;let pickedCard=s.discard.pop();s.picked=pickedCard.id;s.hands[0].push(pickedCard);s.drawn=true;s.msg='Carta do descarte adicionada à mão.';renderCacheta();
}
function discardCacheta(){let s=state;if(!s.drawn||s.selected===null||s.ended)return;let c=s.hands[0][s.selected];if(c.id===s.picked){s.msg='Você não pode devolver a carta que acabou de pegar do descarte.';renderCacheta();return}s.discard.push(s.hands[0].splice(s.selected,1)[0]);s.selected=null;s.drawn=false;s.picked=null;s.msg='O celular está jogando...';renderCacheta();setTimeout(()=>{if(mode!=='cacheta'||s!==state)return;if(!s.d.length){s.msg='Monte esgotado. Reinicie a partida.';renderCacheta();return}s.hands[1].push(s.d.pop());let i=Math.floor(Math.random()*s.hands[1].length);s.discard.push(s.hands[1].splice(i,1)[0]);s.msg='Sua vez! O celular descartou '+name(s.discard.at(-1).v)+s.discard.at(-1).s+'.';renderCacheta()},600)}function beatCacheta(){let s=state;s.msg='Nesta versão de teste, a conferência automática de trincas, sequências e curingas ainda não está pronta. Você já pode organizar, comprar e descartar cartas.';renderCacheta()}

</script></body></html>
